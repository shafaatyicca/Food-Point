<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Order - FoodPoint</title>
    <link rel="shortcut icon" href="images/favicon.png" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link href="css/style.css" rel="stylesheet" />
  </head>
  <body>
    <div id="nav"></div>
    <main id="main">
      <section class="sec">
        <div class="container">
          <h2 class="mb-4">Confirm your order</h2>
          
          <div class="row g-4">
            <div class="col-lg-7">
              <div class="box" id="cart-wrap">
                <div class="table-responsive">
                  <table class="table align-middle mb-0">
                    <thead>
                      <tr>
                        <th>Food</th>
                        <th>Price</th>
                        <th>Qty</th>
                        <th>Total</th>
                        <th></th>
                      </tr>
                    </thead>
                    <tbody id="cart-body"></tbody>
                    <tfoot>
                      <tr>
                        <th colspan="3" class="text-end">Total</th>
                        <th class="price" id="total"></th>
                        <th></th>
                      </tr>
                    </tfoot>
                  </table>
                </div>
              </div>
            </div>
            <div class="col-lg-5" id="of-wrap">
              <form id="of" class="box">
                <h5 class="mb-3">Delivery details</h5>
                <input
                  class="form-control mb-3"
                  name="n"
                  placeholder="Full name"
                  required
                />
                <input
                  class="form-control mb-3"
                  name="p"
                  type="tel"
                  placeholder="Phone number"
                  pattern="[0-9+\- ]{7,}"
                  required
                />
                <input
                  class="form-control mb-3"
                  name="e"
                  type="email"
                  placeholder="Email"
                  required
                />
                <textarea
                  class="form-control mb-3"
                  name="a"
                  rows="2"
                  placeholder="Delivery address"
                  required
                ></textarea>
                <button class="btn btn-acc w-100 py-2">Confirm Order</button>
              </form>
            </div>
          </div>
          <a href="deals.html">Want to save? See today's deals</a>
        </div>
      </section>
    </main>
    <div id="foot"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>

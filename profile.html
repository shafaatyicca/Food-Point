<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Profile - FoodPoint</title><link rel="shortcut icon" href="images/favicon.png">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="css/style.css" rel="stylesheet"></head><body>
<div id="nav"></div>
<main id="main"><div class="auth"><form id="pf" class="box"><h4 class="mb-4">My Profile</h4>
<label class="small text-secondary mb-1">Name</label><input class="form-control mb-3" name="n" required>
<label class="small text-secondary mb-1">Email</label><input class="form-control mb-3" type="email" name="e" required>
<label class="small text-secondary mb-1">New password (optional)</label><input class="form-control mb-4" type="password" name="p" minlength="6" placeholder="Leave empty to keep current">
<button class="btn btn-acc w-100">Update Profile</button></form></div></main>
<div id="foot"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script></body></html>
